services:
  postgres:
    image: postgres:16
    container_name: quantlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quantlab}
      POSTGRES_USER: ${POSTGRES_USER:-quantlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - quantlab-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quantlab} -d ${POSTGRES_DB:-quantlab}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quantlab-postgres-data:
